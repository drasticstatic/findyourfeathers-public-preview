<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Find Your Feathers</title>
  <desc id="d">Discover your wings. The picture: a sun held by an open circle, and 5 waves drawing in beneath it. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082727"/><stop offset="1" stop-color="#09181f"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#047857"/><stop offset="0.50" stop-color="#34d399"/><stop offset="1.00" stop-color="#8ae8c3"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".35" stop-color="#34d399"/><stop offset="1" stop-color="#8ae8c3"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <circle class="breathe" cx="978.7" cy="105.4" r="46" fill="url(#line)"/>
    <path class="draw" pathLength="100" d="M1020.6 54.5A66 66 0 1 1 955.5 43.6" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.20s"/>
    <path class="draw" pathLength="100" d="M620 164.0Q680.8 149.1 741.6 164.0Q802.3 178.9 863.1 164.0Q923.9 149.1 984.7 164.0Q1045.4 178.9 1106.2 164.0Q1167.0 149.1 1227.8 164.0Q1288.5 178.9 1349.3 164.0" fill="none" stroke="url(#fade)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.40s"/>
    <path class="draw" pathLength="100" d="M620 178.5Q693.6 155.0 767.2 178.5Q840.9 202.0 914.5 178.5Q988.1 155.0 1061.7 178.5Q1135.4 202.0 1209.0 178.5Q1282.6 155.0 1356.2 178.5" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 193.0Q683.4 209.2 746.9 193.0Q810.3 176.8 873.8 193.0Q937.2 209.2 1000.7 193.0Q1064.1 176.8 1127.6 193.0Q1191.0 209.2 1254.5 193.0" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 207.5Q682.3 224.8 744.6 207.5Q807.0 190.2 869.3 207.5Q931.6 224.8 993.9 207.5Q1056.2 190.2 1118.5 207.5Q1180.9 224.8 1243.2 207.5" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q690.7 240.4 761.4 222.0Q832.1 203.6 902.8 222.0Q973.5 240.4 1044.2 222.0Q1114.9 203.6 1185.6 222.0Q1256.3 240.4 1327.0 222.0" fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.40s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#064e3b"/><rect x="300.0" y="248" width="300.5" height="12" fill="#047857"/><rect x="600.0" y="248" width="300.5" height="12" fill="#34d399"/><rect x="900.0" y="248" width="300.5" height="12" fill="#d1fae5"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#34d399" font-size="15" font-weight="700" letter-spacing=".6">drasticstatic lab · findyourfeathers.org</text><text x="56" y="137.6" fill="#d1fae5" font-size="60" font-weight="700" letter-spacing="-.5">Find Your Feathers</text><text x="56" y="181.4" fill="#b5dcca" font-size="23">Discover your wings.</text></g>
  </g>
</svg>
